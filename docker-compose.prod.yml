services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.bun
      args:
        - BUILDKIT_INLINE_CACHE=1
        # Consistent build ID for horizontal scaling (prevents version skew)
        - BUILD_ID=${BUILD_ID:-production-build}
        - GIT_HASH=${GIT_HASH:-latest}
    image: ${APP_IMAGE:-nextjs-app:latest}
    # DO NOT add container_name - it breaks scaling
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: 1
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/api/hello').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    # Resource limits (works in Docker Compose v2.4+)
    mem_limit: 1G
    cpus: 2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.docker.compose.project=nextjs-app"
      - "com.docker.compose.service=app"

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-3009}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    mem_limit: 256M
    cpus: 1
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge
