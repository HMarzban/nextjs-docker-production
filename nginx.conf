# Production-grade nginx config for scaled Next.js on Docker
# Inspired by: https://github.com/antonputra/tutorials/tree/221/lessons/221/nginx

# Run as nginx user (alpine default)
user nginx;

# Auto-detect CPU cores and create worker per core
worker_processes auto;

# Bind workers to specific CPU cores for cache efficiency
worker_cpu_affinity auto;

# Async file I/O thread pool (for large static files)
thread_pool default threads=4 max_queue=65536;

# Max open files per worker (handles more connections)
worker_rlimit_nofile 65535;

# Logging
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # Max simultaneous connections per worker
    # 2048 for normal loads, 16384 for high traffic
    worker_connections 4096;
    
    # Use epoll for Linux (most efficient event method)
    use epoll;
    
    # Accept multiple connections at once
    multi_accept on;
}

http {
    # ========================================
    # PERFORMANCE OPTIMIZATIONS
    # ========================================
    
    # Zero-copy file transfer (kernel-level optimization)
    sendfile on;
    
    # Async I/O for large files (>= 6MB use threads)
    aio threads=default;
    directio 8m;
    
    # Send headers in one packet
    tcp_nopush on;
    
    # Don't buffer data - good for real-time
    tcp_nodelay on;
    
    # Close dead connections to free memory
    reset_timedout_connection on;
    
    # Connection timeout
    keepalive_timeout 65;
    keepalive_requests 1000;
    
    # Hash table sizes
    types_hash_max_size 2048;
    server_names_hash_bucket_size 64;
    
    # Hide nginx version (security)
    server_tokens off;
    
    # Don't log missing files
    log_not_found off;
    
    # ========================================
    # CLIENT SETTINGS
    # ========================================
    
    # Max upload size (increased from friend's config)
    client_max_body_size 100M;
    
    # Buffer for request body
    client_body_buffer_size 256k;
    
    # Timeouts for slow clients
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # Headers
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    
    # ========================================
    # FILE DESCRIPTOR CACHE (Huge Performance Win)
    # ========================================
    
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    # ========================================
    # MIME TYPES
    # ========================================
    
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # ========================================
    # LOGGING (with performance metrics)
    # ========================================
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    
    # ========================================
    # GZIP COMPRESSION (Enhanced from friend's config)
    # ========================================
    
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;  
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_disable "msie6";
    
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/cache-manifest
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy
        application/javascript
        application/json
        application/x-javascript
        application/ld+json
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject
        application/manifest+json
        application/rss+xml
        application/atom+xml
        application/vnd.geo+json
        application/x-web-app-manifest+json
        image/svg+xml
        image/x-icon
        image/bmp
        font/opentype
        font/woff
        font/woff2;
    
    # ========================================
    # DOCKER DNS RESOLVER (CRITICAL for scaled containers)
    # ========================================
    
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 10s;
    
    # ========================================
    # UPSTREAM - Next.js Backend
    # ========================================
    
    upstream nextjs {
        # least_conn is optimal for SSR/API workloads
        least_conn;
        
        # Docker Compose auto-discovers scaled instances
        server app:3000 max_fails=3 fail_timeout=30s;
        
        # Connection pooling (MASSIVE performance boost)
        keepalive 128;  # Increased from 64
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }
    
    # ========================================
    # RATE LIMITING (DDoS Protection - Missing from friend's config!)
    # ========================================
    
    limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=uploads:10m rate=5r/s;
    
    # Connection limits
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    
    # ========================================
    # SERVER BLOCK
    # ========================================
    
    server {
        listen 80 default_server reuseport;
        listen [::]:80 default_server reuseport;
        server_name _;
        
        # Max connections per IP
        limit_conn addr 100;
        
        # ========================================
        # SECURITY HEADERS
        # ========================================
        
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Security-Policy "default-src 'self'" always;
        
        # ========================================
        # HEALTH CHECK (No rate limiting)
        # ========================================
        
        location = /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # ========================================
        # NGINX STATUS (Optional - for monitoring)
        # ========================================
        
        location = /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Docker networks
            deny all;
        }
        
        # ========================================
        # API ROUTES (Rate limited)
        # ========================================
        
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            
            # Reuse keepalive connections
            proxy_set_header Connection "";
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Failover to healthy containers
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
            
            # No cache for API
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
        
        # ========================================
        # FILE UPLOADS (Special handling)
        # ========================================
        
        location /api/upload {
            limit_req zone=uploads burst=5 nodelay;
            
            # Large upload support
            client_max_body_size 100M;
            client_body_buffer_size 1M;
            client_body_timeout 300s;
            
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            
            # Long timeout for uploads
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Large buffer for uploads
            proxy_request_buffering off;
            proxy_buffering off;
        }
        
        # ========================================
        # NEXT.JS STATIC ASSETS (Aggressive caching)
        # ========================================
        
        location /_next/static/ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # NO buffering - stream directly (fixes ERR_INCOMPLETE_CHUNKED_ENCODING)
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Use async I/O for large files
            aio threads=default;
            
            # Failover
            proxy_next_upstream error timeout http_502 http_503 http_504;
            
            # Immutable cache (1 year)
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        
        # ========================================
        # PUBLIC ASSETS
        # ========================================
        
        location /public/ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            proxy_buffering off;
            aio threads=default;
            
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }
        
        # ========================================
        # NEXT.JS IMAGE OPTIMIZATION
        # ========================================
        
        location /_next/image {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Image processing needs time
            proxy_read_timeout 60s;
            
            # Buffer for image processing
            proxy_buffering on;
            proxy_buffer_size 64k;
            proxy_buffers 8 64k;
            proxy_busy_buffers_size 128k;
            
            # Cache processed images
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }
        
        # ========================================
        # STATIC FILE TYPES (Direct caching)
        # ========================================
        
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif)$ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }
        
        # ========================================
        # ALL OTHER REQUESTS (SSR pages)
        # ========================================
        
        location / {
            # Rate limiting for pages
            limit_req zone=general burst=100 nodelay;
            
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SSR timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Failover to healthy containers
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            
            # Buffer settings for HTML
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 8 128k;
            proxy_busy_buffers_size 256k;
            
            # Optional: Cache SSG pages
            # add_header Cache-Control "public, max-age=3600, s-maxage=3600";
        }
    }
    
    # ========================================
    # WEBSOCKET UPGRADE MAP
    # ========================================
    
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
}
