name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_ENV: test
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Type check
        run: bun run type-check

      - name: Test load-test failure thresholds
        run: bash scripts/test-load-thresholds.sh

      - name: Check formatting
        run: bun run format:check

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.bun
          push: false
          tags: nextjs-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_ID=ci-build-${{ github.sha }}
            GIT_HASH=${{ github.sha }}

  docker-compose-test:
    name: Docker Compose Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Compose plugin
        run: docker compose version

      - name: Build with Docker Compose
        run: |
          export BUILD_ID="ci-build-${{ github.sha }}"
          export GIT_HASH="${{ github.sha }}"
          docker compose -f docker-compose.prod.yml build

      - name: Start containers
        run: |
          export BUILD_ID="ci-build-${{ github.sha }}"
          export GIT_HASH="${{ github.sha }}"
          docker compose -f docker-compose.prod.yml up -d --scale app=2 --wait --wait-timeout 120

      - name: Wait for health checks
        run: |
          timeout=60
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if curl -f http://localhost:3009/health > /dev/null 2>&1; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "Health check timeout"
          docker compose -f docker-compose.prod.yml logs
          exit 1

      - name: Test API endpoint
        run: |
          curl -f http://localhost:3009/api/hello || exit 1

      - name: Run API smoke assertions
        run: bash scripts/test-api.sh

      - name: Collect diagnostics
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.prod.yml down -v
